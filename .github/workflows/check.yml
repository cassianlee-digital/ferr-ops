# 云端检查：每次推送后，在 GitHub 的机器上把全量测试再跑一遍（和提交前门禁 .githooks/pre-commit 跑的是同一套）。
#
# 为什么还要它：提交前门禁只在「启用了钩子的那个克隆」上生效。别的电脑、别的 AI 会话、
# 在服务器上直接改的提交，都可能没经过任何测试就进了仓库 —— 这里是兜底，谁推的都会跑。
# 它不需要任何密钥：测试不读 .env，用到的配置都由测试自己声明。
name: 检查

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # 根目录的依赖只有打包器：没有它，「打包产物是否过期」那条测试会被跳过
      - name: 安装打包器
        run: npm ci

      - name: 安装后端依赖
        run: npm ci
        working-directory: server

      # 装在独立站上的 WordPress 插件有一半是 PHP，它的测试要真跑 PHP。这台机器自带；哪天不带了，在这里就说清楚，而不是让测试被跳过
      - name: 确认有 PHP
        run: php -v

      - name: 跑全量测试
        working-directory: server
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=result.tap

      # 被跳过的测试等于没跑。这里的环境是齐的，不该有任何一条被跳过；有就当失败，免得「全绿」其实少查了东西
      - name: 不允许有被跳过的测试
        working-directory: server
        run: |
          grep -E '^# (tests|pass|fail|skipped) ' result.tap
          if ! grep -qx '# skipped 0' result.tap; then
            echo "::error::有测试被跳过了。往上翻测试输出，找带 SKIP 的那几条：它们各自写了跳过的原因和补救办法。"
            exit 1
          fi

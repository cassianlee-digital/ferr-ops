<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 费尔瑞 FERR 运营指挥中心</title>
<link rel="icon" type="image/png" href="/ferr-logo.png">
<link rel="apple-touch-icon" href="/ferr-logo.png">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<form class="card" id="loginForm">
  <div class="logo"><div class="logo-icon"><img src="/ferr-logo.png" alt="费尔瑞"></div><div class="logo-text">费尔瑞 FERR<small>运营指挥中心 · 登录</small></div></div>
  <label>账号</label>
  <input id="username" autocomplete="username" placeholder="li / chen / manager / boss" autofocus>
  <label>密码</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
  <button type="submit" id="btn">登录</button>
  <div class="err" id="err"></div>
  <div class="hint">李=SEO · 陈=SEM · 主管=Manager · 老板=Boss。Boss/主管全权；李/陈除KPI目标外全权。</div>
</form>
<script src="/login.js"></script>
</body>
</html>
